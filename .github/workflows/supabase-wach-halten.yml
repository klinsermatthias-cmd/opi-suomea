# Supabase pausiert Gratis-Projekte nach ca. 7 Tagen ohne Zugriff. Diese Action fragt alle 3 Tage kurz an.
# Einrichten: GitHub → Settings → Secrets and variables → Actions → „New repository secret“:
#   SUPABASE_URL (z. B. https://xyz.supabase.co) und SUPABASE_ANON_KEY (der „anon public“-Schlüssel).
# Ohne diese Secrets tut die Action nichts.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Anfrage an Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Keine Supabase-Secrets eingetragen – übersprungen."; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "${URL%/}/rest/v1/progress?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Antwort: $code"
          [ "$code" -lt 500 ]
