# Prüft jede Änderung (tools/pruefen.mjs) und veröffentlicht die App nur, wenn alles in Ordnung ist.
# Voraussetzung: GitHub → Settings → Pages → Source: „GitHub Actions“.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: App prüfen
        env:
          BASIS: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node tools/pruefen.mjs

  veroeffentlichen:
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/lektionen
          cp index.html farben.css app.css sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp -r js _site/
          cp lektionen/lektionen.json lektionen/ki-pruefung.json _site/lektionen/
          echo "{\"v\":\"${{ github.sha }}\"}" > _site/version.json
          # Versionsnummer in den Adressen von Skripten und Stylesheets: eine Seite lädt so immer zusammenpassende
          # Dateien (nie alte und neue gemischt, auch nicht bei langsamem Netz über den Service Worker).
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/[^\"?]+\.js)\"#\1?v=$V\"#g; s#(href=\"[a-z]+\.css)\"#\1?v=$V\"#g" _site/index.html
          grep -q "js/start.js?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub findet das eben hochgeladene Paket manchmal erst nach ein paar Sekunden („No artifacts named
      # github-pages were found“). Dann nach kurzer Pause ein zweiter Versuch, statt die Veröffentlichung zu verlieren.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deploy
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
