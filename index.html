  pasteimport:()=>{CUR={tab:"progress",arg:null};render();A.importopen();$("#out2").scrollIntoView({behavior:"smooth"})},
  importopen:()=>{$("#out2").innerHTML=`<p style="margin-top:14px"><b>Backup einfügen</b></p><input type="file" id="impfile" accept=".json,application/json" class="inp" style="margin-bottom:8px"><textarea class="out" id="impta" placeholder="… oder Backup-Text hier einfügen"></textarea><div class="btnrow"><button class="btn sm" data-act="importdo">Einspielen</button></div>`},
  importdo:()=>importText($("#impta").value),
  toggleai:()=>{S.settings.ai=!S.settings.ai;save();render()},
  rescuedl:()=>{const all={};Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>all[k]=localStorage.getItem(k));dl(JSON.stringify(all),"opi-suomea-rohdaten-"+todayKey()+".json","application/json")},
  reload:()=>location.reload(),
  reset:(id,b)=>{if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Wirklich alles löschen? Nochmal tippen";return}safeCopy("-vor-loeschen",S);S=defaultState();migrate();save();CUR={tab:"today",arg:null};render();toast("Fortschritt gelöscht – eine Kopie liegt noch auf dem Gerät")}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f){e.preventDefault();f(b.dataset.id,b)}});
document.addEventListener("change",e=>{
  if(e.target.id==="newper"){S.settings.newCardsPerDay=+e.target.value;save()}
  if(e.target.id==="extranum"){S.settings.extraCards=+e.target.value;save()}
  if(e.target.id==="newtop"){S.settings.newTopicsPerDay=+e.target.value;save()}
  if(e.target.id==="impfile"&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>importText(fr.result);fr.readAsText(e.target.files[0])}
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!SESSION)return;
  if(e.target.id==="askq")return;
  if(SESSION.kind==="topic"){e.preventDefault();
    if(!SESSION.locked&&e.target.classList&&e.target.classList.contains("tcell")){const cs=[...document.querySelectorAll(".tcell")],i=cs.indexOf(e.target);const nx=cs.slice(i+1).find(c=>!c.value.trim())||cs.slice(i+1)[0];if(nx){nx.focus();return}}
    if(!SESSION.locked)checkAnswer();else if($("#nextbtn"))nextEx()}
  else if(SESSION.kind==="vocab"&&!SESSION.shown){e.preventDefault();flipCard()}
  else if(SESSION.kind==="listen"){e.preventDefault();if(!SESSION.shown)checkListen();else{SESSION.idx++;renderListen()}}
  else if(SESSION.kind==="listenS"){e.preventDefault();if(!SESSION.shown)checkListenS(false);else if($("#nextbtn")){SESSION.idx++;renderListenS()}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askq"){e.preventDefault();const b=document.querySelector('[data-act="ask"]');if(b)askTeacher(b.dataset.id)}});

function landscape(){
  let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  let d="M0 30",m="M0 30",x=-6;
  while(x<1206){const w=8+r()*10,h=8+r()*20;
    d+=` L${x.toFixed(1)} 30 L${(x+w/2).toFixed(1)} ${(30-h).toFixed(1)} L${(x+w).toFixed(1)} 30`;
    m+=` L${x.toFixed(1)} 30 L${(x+w/2).toFixed(1)} ${(30+h*0.45).toFixed(1)} L${(x+w).toFixed(1)} 30`;
    x+=w*0.82;}
  $("#forest").setAttribute("d",d+" L1206 30 Z");$("#mirror").setAttribute("d",m+" L1206 30 Z");
}
/* Nachtmodus */
const DARK_MQ=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(){const t=S?S.settings.theme:"auto";const dark=t==="dark"||(t==="auto"&&DARK_MQ&&DARK_MQ.matches);document.documentElement.dataset.theme=dark?"dark":"light"}
if(DARK_MQ&&DARK_MQ.addEventListener)DARK_MQ.addEventListener("change",applyTheme);
applyTheme();
/* Rettung: falls beim Start etwas schiefgeht, nie eine weiße Seite – Rohdaten sichern können */
function rescue(e){
  const el=app();if(!el)return;
  el.innerHTML=`<div class="card"><div class="label">Die App konnte nicht starten</div><p>Deine Daten sind noch auf diesem Gerät${cloudOn()?" und in der Cloud":""}. Bitte sichere zuerst die Rohdaten und schick Claude die Fehlermeldung.</p><p class="muted">${esc(e&&(e.message||e))}</p><div class="btnrow"><button class="btn" data-act="rescuedl">Rohdaten sichern</button><button class="btn ghost" data-act="reload">Neu laden</button></div></div>`;
}
let ERR_SHOWN=0;
window.addEventListener("error",e=>{if(Date.now()-ERR_SHOWN<10000)return;ERR_SHOWN=Date.now();
  if(!app().innerHTML.trim())rescue(e.error||e.message);else toast("Unerwarteter Fehler – deine Daten sind gespeichert. Bitte App neu laden.")});
(async function init(){
  try{landscape();await load();applyTheme();render()}
  catch(e){console.error(e);rescue(e);return}
  startupPull();
  if(CFG.autoFile)writeAutoFile(false);
  loadRepoLessons();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
