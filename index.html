<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opi suomea – Finnisch lernen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a3a7e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Opi suomea">
<style>
:root{
  --lumi:#f3f6f9;      /* Schnee */
  --paper:#ffffff;
  --sini:#0a3a7e;      /* Flaggenblau */
  --sini-d:#072b5e;
  --yo:#0e1a2b;        /* Nacht */
  --jarvi:#e2ecf6;     /* See */
  --muted:#5a6a80;
  --line:#dbe3ec;
  --kuusi:#2d6a4f;     /* Fichte */
  --kuusi-bg:#e6f2ec;
  --puolukka:#b3243b;  /* Preiselbeere */
  --puolukka-bg:#fbeaed;
  --lakka:#d98a1f;     /* Moltebeere */
  --lakka-bg:#fdf3e2;
  --lakka-ink:#8a5a0f;
  --on-sini:#ffffff;
  --head:#0a3a7e;
  --head-forest:#072b5e;
  --next-bg:#0a3a7e;
  --tip:#f5f3ee;
  --lock:#eef0f3;
  --mirror:#dfe8f2;
  color-scheme:light;
}
/* Nachtmodus – finnische Polarnacht (kaamos) */
:root[data-theme="dark"]{
  --lumi:#0c1520;--paper:#141f2d;--sini:#7db3f0;--sini-d:#9cc6f5;--yo:#e5ecf4;--jarvi:#1a2b40;--muted:#98a9bd;--line:#26364a;
  --kuusi:#62c493;--kuusi-bg:#13302a;--puolukka:#f2798a;--puolukka-bg:#3a1b23;--lakka:#f0b050;--lakka-bg:#36290f;--lakka-ink:#f0b050;
  --on-sini:#081a30;--head:#0b2447;--head-forest:#05152b;--next-bg:#17365f;--tip:#1c2633;--lock:#1d2836;--mirror:#162334;
  color-scheme:dark;
}
:root[data-theme="dark"] .fb.ok,:root[data-theme="dark"] .fb.bad,:root[data-theme="dark"] .fb.dunno{border-color:transparent}
:root[data-theme="dark"] .next .btn{background:#e5ecf4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--lumi);color:var(--yo);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7fb0ea;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopf mit See und Wald */
header.top{background:var(--head);color:#fff;position:relative;overflow:hidden}
.top-inner{max-width:680px;margin:0 auto;padding:16px 18px 46px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;opacity:.78;font-size:12.5px;font-weight:500;letter-spacing:0}
.sync{font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.err{background:var(--puolukka)}
.landscape{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:1;display:block;width:100%}

main{max-width:680px;margin:0 auto;padding:18px 16px 28px}
.card{background:var(--paper);border-radius:14px;padding:18px;margin:0 0 14px;border:1px solid var(--line)}
.label{font-size:13px;color:var(--sini);font-weight:650;margin:0 0 4px}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.015em;line-height:1.25}
h3{font-size:16px;margin:20px 0 8px}
p{line-height:1.55;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
small{color:var(--muted)}

.btn{appearance:none;border:0;background:var(--sini);color:var(--on-sini);font-weight:650;font-size:15.5px;padding:13px 18px;border-radius:11px;cursor:pointer;width:100%;transition:transform .06s,background .15s}
.btn:hover{background:var(--sini-d)}
.btn:active{transform:scale(.985)}
.btn.sm{width:auto;padding:9px 15px;font-size:14px}
.btn.ghost{background:transparent;color:var(--sini);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--jarvi)}
.btn.danger{background:transparent;color:var(--puolukka);border:1.5px solid var(--puolukka-bg)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1;min-width:140px}

/* Heute */
.greet{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 2px;line-height:1.1}
.date{color:var(--muted);margin-bottom:16px}
.facts{display:flex;gap:22px;margin:0 0 18px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-size:22px;font-weight:800;color:var(--sini)}
.facts span{font-size:13px;color:var(--muted)}
.next{background:var(--next-bg);color:#fff;border-radius:16px;padding:20px;margin:0 0 14px}
.next .label{color:#bcd3f2}
.next h2{color:#fff;font-size:22px}
.next p{color:#dbe7f7}
.next .btn{background:#fff;color:#0a3a7e}
.next .btn:hover{background:#e2ecf6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{display:block}
.teacher{border-left:4px solid var(--sini);background:var(--jarvi);border-radius:4px 14px 14px 4px;padding:14px 16px;margin:0 0 14px}
.teacher p{margin:0 0 6px}

/* Themenliste */
.tlist{list-style:none;margin:0;padding:0}
.titem{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.titem:hover{background:var(--jarvi)}
.titem .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--jarvi);color:var(--sini)}
.titem.locked .num,.titem.locked b,.titem.locked .fi,.titem.locked .badge{opacity:.55}
.titem .req{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.req .ok{color:var(--kuusi);font-weight:650}.req .no{color:var(--puolukka);font-weight:650}
.reqrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.reqrow:last-of-type{border-bottom:0}
.reqrow .rq{flex:1;min-width:0}.reqrow small{display:block;color:var(--muted);margin-top:2px}
.titem .body{flex:1;min-width:0}
.titem .fi{font-size:13px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--kuusi)}
.badge{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--jarvi);color:var(--sini)}
.badge.due{background:var(--lakka-bg);color:var(--lakka-ink)}
.badge.new{background:var(--kuusi-bg);color:var(--kuusi)}
.badge.locked{background:var(--lock);color:var(--muted)}

/* Theorie */
.theory h3:first-child{margin-top:0}
.theory table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}
.theory td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.theory td:first-child{font-weight:650;color:var(--sini);width:46%}
.theory .rule{background:var(--jarvi);border-left:3px solid var(--sini);padding:10px 12px;border-radius:3px 8px 8px 3px}
.theory .tip{background:var(--tip);border-left:3px solid #9a8f7a;padding:10px 12px;border-radius:3px 8px 8px 3px}
.theory ul{padding-left:20px;line-height:1.6}
.ftitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.05}
.back{background:none;border:0;color:var(--sini);font-weight:650;padding:4px 0;margin-bottom:10px;cursor:pointer}

/* Übungen */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sini);transition:width .3s}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.ask{font-size:14px;color:var(--muted);margin-bottom:6px}
.q{font-size:24px;font-weight:750;letter-spacing:-.015em;line-height:1.3;margin:0 0 16px}
.q .gap{display:inline-block;min-width:56px;border-bottom:3px solid var(--sini);color:var(--sini)}
.gw{cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,currentColor 45%,transparent);-webkit-tap-highlight-color:transparent}
.gw:hover,.gw.on{background:var(--jarvi);border-radius:4px}
#gloss{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 32px));background:var(--paper);color:var(--yo);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:15px;line-height:1.35}
#gloss b{color:var(--sini)}#gloss small{display:block;color:var(--muted);margin-top:3px}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:13px 15px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--sini)}
.opt.right{border-color:var(--kuusi);background:var(--kuusi-bg)}
.opt.wrong{border-color:var(--puolukka);background:var(--puolukka-bg)}
.inp{width:100%;color:var(--yo);padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:17px;background:var(--paper)}
.inp:focus{border-color:var(--sini);outline:none}
.hint{font-size:14px;color:var(--muted);margin:-8px 0 12px}
.tabex{width:100%;border-collapse:collapse;margin:0 0 6px;font-size:16px}
.tabex th{font-size:13px;font-weight:650;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line)}
.tabex td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tabex td.fix{font-weight:650;color:var(--sini)}
.tabex input{width:100%;min-width:0;padding:8px 9px;font-size:16px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--yo)}
.tabex input.ok{border-color:var(--kuusi);background:var(--kuusi-bg)}
.tabex input.no{border-color:var(--puolukka);background:var(--puolukka-bg)}
.tabex .sol{display:block;font-size:13px;color:var(--kuusi);font-weight:650;margin-top:3px}
.ordline{min-height:54px;border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.ph{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;font-weight:600}
.chip.on{background:var(--jarvi);border-color:var(--sini);color:var(--sini)}
.chip.ghost{visibility:hidden}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px}
.fb.ok{background:var(--kuusi-bg);border:1px solid #bfdccd}
.fb.bad{background:var(--puolukka-bg);border:1px solid #efc2ca}
.fb.wait{background:var(--jarvi)}
.fb.dunno{background:var(--lakka-bg);border:1px solid #f0d7a8}
.fb.dunno b.t{color:var(--lakka-ink)}
.fb b.t{display:block;margin-bottom:4px;font-size:16px}
.fb.ok b.t{color:var(--kuusi)}
.fb.bad b.t{color:var(--puolukka)}
.fb p{margin:4px 0 0}

/* Ergebnis */
.center{text-align:center}
.ring{width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--sini) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:10px auto 8px}
.ring span{width:100px;height:100px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--sini)}
.err{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.err .u{color:var(--puolukka)}
.err .r{color:var(--kuusi);font-weight:650}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media (max-width:440px){.rates{grid-template-columns:repeat(2,1fr)}}
.rate{border-radius:11px;padding:12px 6px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate b{font-size:15px}
.rate small{font-size:12px}
.rate.again b{color:var(--puolukka)} .rate.again:hover{background:var(--puolukka-bg)}
.rate.hard b{color:var(--lakka-ink)} .rate.hard:hover{background:var(--lakka-bg)}
.rate.good b{color:var(--sini)} .rate.good:hover{background:var(--jarvi)}
.rate.easy b{color:var(--kuusi)} .rate.easy:hover{background:var(--kuusi-bg)}
.aibox ul{padding-left:20px;margin:8px 0;line-height:1.55}
.plan{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sini);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Karteikarten */
.flash .front{font-size:36px;font-weight:800;letter-spacing:-.02em;text-align:center;padding:26px 0 18px;word-break:break-word}
.flash .backside{text-align:center;font-size:22px;font-weight:700;color:var(--sini);padding:4px 0 14px;border-top:1px dashed var(--line)}
.flash .backside small{display:block;font-size:14px;font-weight:500;margin-top:4px}
.cmp{font-size:14px;text-align:center;margin-bottom:10px}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.vrow .w{font-weight:650}
.vrow .d{color:var(--muted);flex:1;text-align:left;margin-left:10px}
.st{font-size:12px;font-weight:650;white-space:nowrap}
.st.neu{color:var(--muted)} .st.lernt{color:var(--lakka-ink)} .st.gut{color:var(--sini)} .st.sicher{color:var(--kuusi)}

/* Fortschritt */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--jarvi);border-radius:12px;padding:12px 14px}
.stat b{font-size:24px;font-weight:800;color:var(--sini);display:block}
.stat span{font-size:13px;color:var(--muted)}
.level{display:inline-block;font-size:26px;font-weight:800;color:var(--on-sini);background:var(--sini);border-radius:10px;padding:4px 12px;margin-right:8px}
textarea.out{width:100%;background:var(--paper);color:var(--yo);min-height:160px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
select.inp{padding:10px}
details summary{cursor:pointer;margin-top:4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

/* Audio */
.spk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--sini);cursor:pointer;vertical-align:middle;margin-right:8px;flex:none;padding:0}
.spk:hover{background:var(--jarvi);border-color:var(--sini)}
.spk svg{width:15px;height:15px;pointer-events:none}
.spk.big{width:52px;height:52px;margin:0 auto}
.spk.big svg{width:24px;height:24px}
.sayable{text-decoration:underline dotted var(--sini);text-underline-offset:3px;cursor:pointer}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted)}
nav.tabs button b{font-size:12.5px;font-weight:700}
nav.tabs button small{font-size:10.5px}
nav.tabs button.on{color:var(--sini)}
nav.tabs svg{width:22px;height:22px}
#toast{position:fixed;border:1px solid rgba(255,255,255,.15);left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0e1a2b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><rect x="9.5" y="0" width="6" height="32" fill="#0a3a7e"/><rect x="0" y="13" width="32" height="6" fill="#0a3a7e"/></svg>
      <div><h1>Opi suomea</h1><small>Dein Finnischkurs mit Opettaja</small></div>
    </div>
    <div id="sync" class="sync">Lädt …</div>
  </div>
  <svg class="landscape" viewBox="0 0 1200 44" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path id="forest" style="fill:var(--head-forest)"/>
    <rect x="0" y="30" width="1200" height="14" style="fill:var(--lumi)"/>
    <path id="mirror" style="fill:var(--mirror)"/>
  </svg>
</header>

<main id="app"></main>

<nav class="tabs"><div class="in">
  <button data-act="tab" data-id="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><b>Tänään</b><small>Heute</small></button>
  <button data-act="tab" data-id="topics" id="tab-topics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><b>Aiheet</b><small>Themen</small></button>
  <button data-act="tab" data-id="vocab" id="tab-vocab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><b>Sanat</b><small>Vokabeln</small></button>
  <button data-act="tab" data-id="progress" id="tab-progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M6 16v-4M11 16V8M16 16v-6M21 16V5"/></svg><b>Asetukset</b><small>Einstellungen</small></button>
</div></nav>
<div id="toast"></div>

<script>
/* ============================================================
   LERNINHALTE – Paket 1 (A0). Neue Pakete werden hier ergänzt.
   ============================================================ */
const BASE_TOPICS = [
{id:"t01", title:"Aussprache & Alphabet", fi:"Ääntäminen", lvl:"A0", req:[],
th:`<p>Gute Nachricht zuerst: Finnisch wird fast genau so gesprochen, wie es geschrieben wird. Jeder Buchstabe hat immer denselben Laut.</p>
<h3>Die Betonung</h3>
<p class="rule">Betont wird <b>immer die erste Silbe</b>: <i>KII-tos</i>, <i>SAU-na</i>, <i>HEL-sinki</i>.</p>
<h3>Die Vokale</h3>
<table><tr><td>a, e, i, o, u</td><td>wie im Deutschen</td></tr><tr><td>y</td><td>wie deutsches <b>ü</b> – <i>yksi</i> (eins)</td></tr><tr><td>ä</td><td>sehr offen, wie das a in engl. „cat“ – <i>järvi</i> (See)</td></tr><tr><td>ö</td><td>wie deutsches ö – <i>yö</i> (Nacht)</td></tr></table>
<h3>Lang oder kurz ändert die Bedeutung</h3>
<p>Doppelt geschriebene Buchstaben werden länger gesprochen. Das ist kein Detail, sondern ein anderes Wort:</p>
<table><tr><td>tuli</td><td>Feuer</td></tr><tr><td>tuuli</td><td>Wind</td></tr><tr><td>muta</td><td>Schlamm</td></tr><tr><td>mutta</td><td>aber</td></tr></table>
<h3>Falle für Deutschsprachige</h3>
<p class="tip">Vokalpaare werden als <b>beide Laute</b> gesprochen, nicht wie im Deutschen zusammengezogen.</p>
<table><tr><td>ei</td><td>e + i, wie engl. „hey“ – nicht wie „Eis“</td></tr><tr><td>ie</td><td>i + e: <i>tie</i> (Weg) = „ti-e“ – nicht wie „Lied“</td></tr><tr><td>eu</td><td>e + u – nicht wie „Euro“</td></tr><tr><td>yö</td><td>ü + ö: <i>yö</i> (Nacht)</td></tr></table>
<h3>Konsonanten</h3>
<ul><li><b>r</b> wird gerollt (Zungenspitzen-r).</li><li><b>s</b> ist immer scharf wie in „Bus“.</li><li><b>h</b> wird immer gesprochen, auch mitten im Wort: <i>lahti</i> (Bucht).</li><li><b>v</b> klingt wie deutsches w, <b>j</b> wie deutsches j.</li><li><b>k, p, t</b> klingen weicher, ohne Hauch.</li><li>Doppelte Konsonanten werden gehalten: <i>kissa</i> = „kis-sa“.</li></ul>`,
v:[["kiitos","danke"],["kyllä","ja"],["ei","nein"],["talo","Haus"],["tie","Weg, Straße"],["yö","Nacht"],["kissa","Katze"],["koira","Hund"],["järvi","See"],["metsä","Wald"],["tuuli","Wind"],["kuu","Mond"]],

{t:"mc",q:"Welche Silbe wird im Finnischen betont?",o:["immer die erste","immer die letzte","die vorletzte","das ist unterschiedlich"],a:0,x:"Die Betonung liegt immer auf der ersten Silbe."},

{id:"t02", title:"Begrüßungen & Höflichkeit", fi:"Tervehdykset", lvl:"A0", req:["t01"],
th:`<p>Finn*innen sind sprachlich unkompliziert: Man duzt sich fast immer, auch im Job.</p>
<h3>Hallo und Tschüss</h3>
<table><tr><td>Moi! / Hei!</td><td>Hallo (locker)</td></tr><tr><td>Moi moi! / Heippa!</td><td>Tschüss</td></tr><tr><td>Hyvää huomenta</td><td>Guten Morgen</td></tr><tr><td>Hyvää päivää</td><td>Guten Tag (förmlich)</td></tr><tr><td>Hyvää iltaa</td><td>Guten Abend</td></tr><tr><td>Hyvää yötä</td><td>Gute Nacht</td></tr><tr><td>Näkemiin</td><td>Auf Wiedersehen (förmlich)</td></tr></table>
<p class="tip"><i>Hyvää</i> heißt „einen guten …“. Du hängst einfach die Tageszeit an.</p>
<h3>Höflich sein</h3>
<table><tr><td>Kiitos</td><td>Danke</td></tr><tr><td>Kiitos paljon</td><td>Vielen Dank</td></tr><tr><td>Ole hyvä</td><td>Bitte (beim Geben) / Gern geschehen</td></tr><tr><td>Anteeksi</td><td>Entschuldigung</td></tr><tr><td>Kyllä / Joo</td><td>Ja (joo ist locker)</td></tr><tr><td>Ei</td><td>Nein</td></tr></table>
<h3>Ein kleines Gespräch</h3>
<table><tr><td>Moi! Mitä kuuluu?</td><td>Hallo! Wie geht’s?</td></tr><tr><td>Hyvää, kiitos. Entä sinulle?</td><td>Gut, danke. Und dir?</td></tr><tr><td>Ihan hyvää. Minun nimeni on Matthias.</td><td>Ganz gut. Mein Name ist Matthias.</td></tr><tr><td>Hauska tutustua!</td><td>Freut mich!</td></tr></table>
<p class="tip"><i>Mitä kuuluu?</i> heißt wörtlich „Was ist zu hören?“</p>`,
v:[["moi","hallo"],["moi moi","tschüss"],["hyvää huomenta","guten Morgen"],["hyvää päivää","guten Tag"],["hyvää iltaa","guten Abend"],["hyvää yötä","gute Nacht"],["näkemiin","auf Wiedersehen"],["kiitos paljon","vielen Dank"],["ole hyvä","bitte (beim Geben) / gern geschehen"],["anteeksi","Entschuldigung"],["mitä kuuluu?","wie geht’s?"],["entä sinulle?","und dir?"],["hauska tutustua","freut mich"],["joo","ja (umgangssprachlich)"]],

{id:"t03", title:"Zahlen 0–20", fi:"Numerot", lvl:"A0", req:["t01"],
th:`<h3>0 bis 10</h3>
<table><tr><td>nolla</td><td>0</td></tr><tr><td>yksi</td><td>1</td></tr><tr><td>kaksi</td><td>2</td></tr><tr><td>kolme</td><td>3</td></tr><tr><td>neljä</td><td>4</td></tr><tr><td>viisi</td><td>5</td></tr><tr><td>kuusi</td><td>6</td></tr><tr><td>seitsemän</td><td>7</td></tr><tr><td>kahdeksan</td><td>8</td></tr><tr><td>yhdeksän</td><td>9</td></tr><tr><td>kymmenen</td><td>10</td></tr></table>
<h3>11 bis 19: Zahl + toista</h3>
<p class="rule"><i>toista</i> heißt ungefähr „vom zweiten (Zehner)“. Du hängst es einfach an: <b>yksitoista</b> = 11, <b>kaksitoista</b> = 12, <b>viisitoista</b> = 15.</p>
<h3>Zehner: Zahl + kymmentä</h3>
<p class="rule"><b>kaksikymmentä</b> = 20 (zwei Zehner).</p>
<p class="tip">Lustig: <i>kuusi</i> heißt „sechs“ und auch „Fichte“. <i>Kuu</i> ist der Mond.</p>`,

{id:"t04", title:"Ich bin – du bist (olla)", fi:"Persoonapronominit ja olla", lvl:"A0", req:["t02"],
th:`<p>Das wichtigste Verb überhaupt: <b>olla</b> = sein.</p>
<table><tr><td>minä olen</td><td>ich bin</td></tr><tr><td>sinä olet</td><td>du bist</td></tr><tr><td>hän on</td><td>er / sie ist</td></tr><tr><td>me olemme</td><td>wir sind</td></tr><tr><td>te olette</td><td>ihr seid / Sie sind</td></tr><tr><td>he ovat</td><td>sie sind</td></tr></table>
<h3>Drei Besonderheiten</h3>
<p class="rule"><b>hän</b> heißt „er“ <b>und</b> „sie“. Finnisch unterscheidet hier kein Geschlecht.</p>
<p class="rule">Bei ich, du, wir, ihr kann das Pronomen wegfallen, weil die Endung es verrät: <i>Olen Matthias.</i> = Ich bin Matthias. Bei <i>hän</i> und <i>he</i> bleibt es stehen.</p>
<p class="rule">Für Dinge sagt man <b>se</b> (es): <i>Se on talo.</i> = Das ist ein Haus.</p>
<p class="tip">Finnisch hat <b>keine Artikel</b>: kein der/die/das, kein ein/eine. <i>talo</i> = das Haus oder ein Haus.</p>
<h3>Beispiele</h3>
<table><tr><td>Olen väsynyt.</td><td>Ich bin müde.</td></tr><tr><td>Hän on opettaja.</td><td>Er / Sie ist Lehrer/in.</td></tr><tr><td>Me olemme kotona.</td><td>Wir sind zu Hause.</td></tr><tr><td>Olen itävaltalainen.</td><td>Ich bin Österreicher.</td></tr></table>
<p class="tip">Gesprochen hörst du oft <i>mä oon</i> (ich bin) und <i>sä oot</i> (du bist). Wir lernen zuerst die Schriftsprache.</p>`,
v:[["minä","ich"],["sinä","du"],["hän","er / sie"],["me","wir"],["te","ihr / Sie"],["he","sie (Mehrzahl)"],["olla","sein"],["opettaja","Lehrer/in"],["opiskelija","Student/in"],["kotona","zu Hause"],["täällä","hier"],["väsynyt","müde"],["iloinen","froh, fröhlich"],["itävaltalainen","Österreicher/in; österreichisch"]],

{id:"t05", title:"Vokalharmonie", fi:"Vokaaliharmonia", lvl:"A0", req:["t01"],
th:`<p>Das ist <b>die</b> Grundregel des Finnischen: Fast jede Endung gibt es in zwei Versionen.</p>
<h3>Drei Vokalgruppen</h3>
<table class="nosay"><tr><td>hinten</td><td>a, o, u</td></tr><tr><td>vorne</td><td>ä, ö, y</td></tr><tr><td>neutral</td><td>e, i</td></tr></table>
<p class="rule">Hat ein Wort <b>a, o oder u</b>, bekommt es Endungen mit a/o/u. Sonst (ä, ö, y oder nur e/i) bekommt es Endungen mit ä/ö/y.</p>
<h3>Beispiel: -ssa / -ssä = „in“</h3>
<table><tr><td>talo → talossa</td><td>im Haus</td></tr><tr><td>koulu → koulussa</td><td>in der Schule</td></tr><tr><td>metsä → metsässä</td><td>im Wald</td></tr><tr><td>kylä → kylässä</td><td>im Dorf</td></tr><tr><td>keittiö → keittiössä</td><td>in der Küche</td></tr></table>
<h3>Städte, die auf Konsonant enden</h3>
<p>Dann kommt ein <b>-i-</b> dazwischen:</p>
<table><tr><td>Graz → Grazissa</td><td>in Graz</td></tr><tr><td>Linz → Linzissä</td><td>in Linz</td></tr><tr><td>Wien → Wienissä</td><td>in Wien</td></tr><tr><td>Steyr → Steyrissä</td><td>in Steyr</td></tr></table>
<p class="tip">Ein Wort nur mit e und i (wie <i>Wien</i>) zählt als „vorne“ und bekommt -ssä.</p>
<p class="tip">Manche Wörter verändern dabei ihren Stamm, etwa <i>Helsinki → Helsingissä</i>. Das kommt in einer späteren Lektion.</p>`,
v:[["koulu","Schule"],["kahvila","Café"],["kylä","Dorf"],["kirjasto","Bibliothek"],["ravintola","Restaurant"],["hotelli","Hotel"],["auto","Auto"],["keittiö","Küche"],["työ","Arbeit"]],

{t:"mc",q:"„Wien“ hat nur e und i. Welche Endung?",o:["-issä","-issa"],a:0,x:"Nur e/i zählt als vorne."},

{id:"t06", title:"Verben Typ 1 im Präsens", fi:"Verbityyppi 1", lvl:"A0+", req:["t04","t05"],
th:`<p>Finnische Verben haben sechs Typen. Typ 1 ist der häufigste: Der Infinitiv endet auf <b>zwei Vokale</b>, der letzte ist a oder ä – <i>puhua, asua, ostaa, kysyä</i>.</p>
<h3>So geht’s</h3>
<p class="rule">1. Letzten Buchstaben streichen → Stamm: puhu|a → <b>puhu-</b><br>2. Personalendung anhängen.</p>
<table><tr><td>minä puhu<b>n</b></td><td>ich spreche</td></tr><tr><td>sinä puhu<b>t</b></td><td>du sprichst</td></tr><tr><td>hän puhu<b>u</b></td><td>er / sie spricht</td></tr><tr><td>me puhu<b>mme</b></td><td>wir sprechen</td></tr><tr><td>te puhu<b>tte</b></td><td>ihr sprecht</td></tr><tr><td>he puhu<b>vat</b></td><td>sie sprechen</td></tr></table>
<p class="tip">Bei „er/sie“ gibt es keine eigene Endung – der letzte Vokal wird einfach <b>verlängert</b>: asu → asuu, sano → sanoo, osta → ostaa.</p>
<p class="tip">Vokalharmonie gilt auch hier: he puhu<b>vat</b>, aber he kysy<b>vät</b>.</p>
<h3>Nützliche Sätze</h3>
<table><tr><td>Asun Steyrissä.</td><td>Ich wohne in Steyr.</td></tr><tr><td>Puhun saksaa.</td><td>Ich spreche Deutsch.</td></tr><tr><td>Puhun vähän suomea.</td><td>Ich spreche ein bisschen Finnisch.</td></tr><tr><td>Hän ostaa kahvia.</td><td>Er / Sie kauft Kaffee.</td></tr></table>
<p class="muted">Sprachen nach <i>puhua</i> haben eine eigene Endung (saksaa, suomea, englantia). Das ist der Partitiv, den du später lernst. Merk sie dir vorerst als feste Ausdrücke.</p>`,
v:[["puhua","sprechen"],["asua","wohnen"],["sanoa","sagen"],["ostaa","kaufen"],["katsoa","schauen, ansehen"],["kysyä","fragen"],["rakastaa","lieben"],["ajaa","fahren (selbst lenken)"],["maksaa","zahlen; kosten"],["istua","sitzen"],["hyvin","gut (Adverb)"],["saksaa","Deutsch (nach puhua)"],["aina","immer"]],

{t:"tab",q:"Zwei Verben nebeneinander",h:"asua (wohnen) und kysyä (fragen) – achte auf die Vokalharmonie",head:["Person", "asua", "kysyä"],r:[["minä", "[asun]", "[kysyn]"], ["sinä", "[asut]", "[kysyt]"], ["hän", "[asuu]", "[kysyy]"], ["me", "[asumme]", "[kysymme]"], ["te", "[asutte]", "[kysytte]"], ["he", "[asuvat]", "[kysyvät]"]],s:1},
{t:"tab",q:"Konjugiere ostaa (kaufen)",head:["Person", "ostaa"],r:[["minä", "[ostan]"], ["sinä", "[ostat]"], ["hän", "[ostaa]"], ["me", "[ostamme]"], ["te", "[ostatte]"], ["he", "[ostavat]"]]},

{id:"t07", title:"Verneinung", fi:"Kieltomuoto", lvl:"A0+", req:["t06"],
th:`<p>Im Finnischen ist „nicht“ ein <b>Verb</b>, das sich nach der Person richtet. Das Hauptverb steht dann nur im Stamm.</p>
<table><tr><td>minä en puhu</td><td>ich spreche nicht</td></tr><tr><td>sinä et puhu</td><td>du sprichst nicht</td></tr><tr><td>hän ei puhu</td><td>er / sie spricht nicht</td></tr><tr><td>me emme puhu</td><td>wir sprechen nicht</td></tr><tr><td>te ette puhu</td><td>ihr sprecht nicht</td></tr><tr><td>he eivät puhu</td><td>sie sprechen nicht</td></tr></table>
<p class="rule">Einfache Regel für den Stamm: Nimm die ich-Form und streich das -n. puhun → <b>en puhu</b>, asun → <b>et asu</b>.</p>
<p class="rule">Das klappt auch bei olla: olen → <b>en ole</b>, et ole, ei ole …</p>
<h3>Beispiele</h3>

const DAY=86400000;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function todayKey(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function startOfDay(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function endOfDay(t=Date.now()){const d=new Date(t);d.setHours(23,59,59,999);return d.getTime()}
function addDays(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()}
function fmtDate(t){if(!t)return"–";return new Date(t).toLocaleDateString("de-AT",{day:"numeric",month:"numeric"})}
function relDays(t){const diff=Math.round((startOfDay(t)-startOfDay())/DAY);if(diff<=0)return"heute";if(diff===1)return"morgen";return"in "+diff+" Tagen"}
function pct(x){return x==null?"–":Math.round(x*100)+" %"}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clampInt(v,a,b){const n=parseInt(v,10);if(isNaN(n))return null;return Math.min(b,Math.max(a,n))}
function norm(s){return String(s||"").toLowerCase().replace(/[.,!?;:"“”„«»()]/g,"").replace(/[’']/g,"").replace(/\s+/g," ").trim()}
function loose(s){return norm(s).replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u")}

function defaultState(){return{v:1,created:Date.now(),updated:0,topics:{},cards:{},errors:[],reports:[],
  daily:{date:todayKey(),newCards:0,newTopics:0},stats:{streak:0,last:null,reviews:0,sessions:0},
  settings:{newCardsPerDay:10,extraCards:10,newTopicsPerDay:2,ai:true,slow:false,autoplay:true,theme:"auto"},lastGlobal:0,sinceGlobal:0,active:null,lastBackup:0,packs:[]}}
function migrate(){
  const d=defaultState();
  for(const k in d) if(S[k]===undefined) S[k]=d[k];
  S.settings={...d.settings,...S.settings}; S.stats={...d.stats,...S.stats};
  rebuildTopics();
  TOPICS.forEach(t=>{ if(!S.topics[t.id]) S.topics[t.id]={status:"locked",ease:2.5,interval:0,reps:0,lapses:0,due:null,last:null,best:null,hist:[],ai:null}; });
  TOPICS.forEach(t=>{ if(S.topics[t.id].status==="learning") addCards(t); });
  if(S.daily.date!==todayKey()) S.daily={date:todayKey(),newCards:0,newTopics:0};
  refreshUnlocks();
}
function hasProgress(x){return !!(x&&((x.stats&&x.stats.sessions)||Object.keys(x.cards||{}).length))}

const CFG_KEY="opi-suomea-config";
function loadCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}}

/* --- Lokal: wird bei JEDER Änderung sofort geschrieben --- */

function setSync(st){const el=$("#sync");if(!el)return;el.classList.toggle("err",st==="err");
  el.textContent={ok:"Synchronisiert ✓",saving:"Speichert …",offline:"Offline · lokal gesichert",local:"Lokal gespeichert",err:"Sync-Fehler · lokal gesichert",login:"Bitte neu anmelden",load:"Lädt …"}[st]||st}
function writeLocal(){const txt=JSON.stringify(S);
  try{localStorage.setItem(KEY,txt)}
  catch(e){ /* Speicher voll: ältere Sicherheitskopien opfern, der aktuelle Stand geht vor */
    try{Object.keys(localStorage).filter(k=>k.startsWith(KEY+"-vor-")).forEach(k=>localStorage.removeItem(k));localStorage.setItem(KEY,txt)}
    catch(e2){toast("Gerätespeicher voll – bitte Sicherung herunterladen")}}}
/* Sicherheitskopie (z. B. "-vor-sync"); darf nie einen Fehler auslösen */
function safeCopy(name,obj){try{localStorage.setItem(KEY+name,JSON.stringify(obj))}catch(e){}}

  S.updated=Date.now();writeLocal();DIRTY=true;autoFileBackup();
  if(!cloudOn()){setSync("local");return}

}

/* --- Supabase (direkt über REST, ohne Zusatzbibliothek) --- */
const sbBase=()=>CFG.sbUrl.replace(/\/+$/,"");
const SB_TIMEOUT=window.OPI_SB_TIMEOUT||25000;
/* fetch mit Zeitlimit: ein hängender Request darf den Sync nie dauerhaft blockieren */
async function fetchSB(url,opt){const c=new AbortController(),tm=setTimeout(()=>c.abort(),SB_TIMEOUT);
  try{const res=await fetch(url,{...opt,signal:c.signal});const text=await res.text();return{res,text}}
  finally{clearTimeout(tm)}}
async function authCall(kind,body){
  const {res,text}=await fetchSB(sbBase()+"/auth/v1/"+kind,{method:"POST",headers:{apikey:CFG.sbKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  let j={};try{j=JSON.parse(text)}catch(e){}
  if(!res.ok){const e=new Error(j.error_description||j.msg||j.message||j.error||("HTTP "+res.status));e.status=res.status;throw e}
  return j;
}
function setSession(j){
  const old=CFG.session||{};
  CFG.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,
    user:{id:(j.user&&j.user.id)||(old.user&&old.user.id),email:(j.user&&j.user.email)||(old.user&&old.user.email)}};
  saveCfg();
}
let REFRESHING=null;
async function ensureToken(force){
  if(!force&&CFG.session.expires_at-60000>Date.now())return;
  const used=CFG.session.refresh_token;
  if(!REFRESHING)REFRESHING=authCall("token?grant_type=refresh_token",{refresh_token:used})
    .then(setSession)
    .catch(e=>{if(e.status>=400&&e.status<500){
        const c=loadCfg();if(c.session&&c.session.refresh_token&&c.session.refresh_token!==used){CFG.session=c.session;return}
        CFG.session=null;saveCfg();setSync("login");toast("Bitte unter Einstellungen → Cloud & KI neu anmelden")}throw e})
    .finally(()=>{REFRESHING=null});
  await REFRESHING;
}
async function sbFetch(path,opt={},retried){
  await ensureToken();
  const {res,text:t}=await fetchSB(sbBase()+path,{...opt,headers:{apikey:CFG.sbKey,Authorization:"Bearer "+CFG.session.access_token,"Content-Type":"application/json",...(opt.headers||{})}});
  if(res.status===401&&!retried){await ensureToken(true);return sbFetch(path,opt,true)}
  if(!res.ok){const e=new Error("HTTP "+res.status);e.status=res.status;throw e}
  return t?JSON.parse(t):null;
}
/* Hochladen nur, wenn die Cloud seit dem letzten Abgleich unverändert ist (CFG.remoteAt).
   Hat ein anderes Gerät inzwischen gespeichert, wird zuerst zusammengeführt – so überschreibt
   kein Gerät die Übungen eines anderen. */
let PUSHING=false,PUSH_AGAIN=false,NO_CAS=false;
async function pushCloud(keepalive){
  PUSH_TIMER=null;if(!cloudOn()||!DIRTY)return;
  if(!navigator.onLine){setSync("offline");return}
  if(PUSHING){PUSH_AGAIN=true;return}
  PUSHING=true;
  try{
    for(let i=0;i<3;i++){
      const upd=S.updated,base=Number.isFinite(CFG.remoteAt)?CFG.remoteAt:Number.isFinite(CFG.syncedAt)?CFG.syncedAt:0;
      const body=JSON.stringify({data:S,updated_at:new Date(upd).toISOString()});
      /* keepalive (beim Schließen) erlaubt nur ~64 KB – größere Stände normal senden */
      const ka=!!keepalive&&body.length<60000;
      if(base&&!NO_CAS){
        let rows=null;
        try{rows=await sbFetch(`/rest/v1/progress?user_id=eq.${uid()}&updated_at=eq.${encodeURIComponent(new Date(base).toISOString())}&select=user_id`,
          {method:"PATCH",keepalive:ka,headers:{Prefer:"return=representation"},body})}
        catch(e){if(e.status!==400)throw e;NO_CAS=true}
        if(rows&&rows.length){pushDone(upd);return}
        if(!NO_CAS&&(SESSION||keepalive)){setSync("saving");return}
      }
      const row=await fetchRemote();
      if(!row){
        try{await sbFetch("/rest/v1/progress",{method:"POST",keepalive:ka,headers:{Prefer:"return=minimal"},
          body:JSON.stringify({user_id:uid(),data:S,updated_at:new Date(upd).toISOString()})});pushDone(upd);return}
        catch(e){if(e.status===409)continue;throw e}
      }
      const ru=Date.parse(row.updated_at);
      if(row.data&&(row.data.updated||0)!==(CFG.syncedAt||0)){
        /* Anderes Gerät hat gespeichert: zusammenführen (während einer Übung erst danach) */
        if(SESSION||keepalive){setSync("saving");return}
        if(hasProgress(S))safeCopy("-vor-sync",S);
        S=mergeStates(S,row.data);migrate();applyTheme();S.updated=Date.now();writeLocal();
        if(!SESSION){render();toast("Mit anderem Gerät zusammengeführt ✓")}
      }
      CFG.remoteAt=ru;saveCfg();
      if(NO_CAS){ /* Ausweichweg, falls die Cloud den Vergleich ablehnt: erst prüfen/zusammenführen, dann schreiben */
        const u2=S.updated,b2=JSON.stringify({user_id:uid(),data:S,updated_at:new Date(u2).toISOString()});
        await sbFetch("/rest/v1/progress?on_conflict=user_id",{method:"POST",keepalive:!!keepalive&&b2.length<60000,
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:b2});
        pushDone(u2);return}
    }
    throw new Error("Sync-Konflikt");
  }catch(e){if(cloudOn()){setSync(navigator.onLine?"err":"offline");syncHint()}}
  finally{PUSHING=false;if(PUSH_AGAIN){PUSH_AGAIN=false;if(DIRTY)setTimeout(()=>pushCloud(),50)}}
}
function pushDone(upd){
  if(S.updated===upd)DIRTY=false;
  CFG.syncedAt=upd;CFG.remoteAt=upd;saveCfg();
  setSync(DIRTY?"saving":"ok");
  if(DIRTY&&!PUSH_TIMER)PUSH_AGAIN=true;
  cloudSnapshot().catch(()=>{});
}
let SYNC_HINTED=false;
function syncHint(){if(SYNC_HINTED||!navigator.onLine)return;SYNC_HINTED=true;
  setTimeout(()=>toast("Cloud nicht erreichbar – alles ist lokal gesichert. Länger nicht gelernt? Dann in Supabase „Resume project“ tippen."),800)}
/* Täglicher Stand in der Cloud – die letzten 30 Tage bleiben erhalten */
async function cloudSnapshot(){
  const d=todayKey();if(CFG.lastSnapDay===d||!hasProgress(S))return;
  await sbFetch("/rest/v1/snapshots?on_conflict=user_id,day",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify({user_id:uid(),day:d,data:S})});
  const old=new Date();old.setDate(old.getDate()-30);
  await sbFetch(`/rest/v1/snapshots?user_id=eq.${uid()}&day=lt.${todayKey(old)}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});
  CFG.lastSnapDay=d;saveCfg();
}
/* Cloud-Zeile {data, updated_at} oder null */
async function fetchRemote(){const rows=await sbFetch(`/rest/v1/progress?select=data,updated_at&user_id=eq.${uid()}`);return rows&&rows[0]&&rows[0].data?rows[0]:null}
/* Führt zwei Stände zusammen (für Änderungen, die offline auf zwei Geräten entstanden sind).
   Pro Thema und pro Karte gewinnt der zuletzt geübte Stand; Listen werden vereinigt. */
function mergeStates(L,R){
  const M=JSON.parse(JSON.stringify(R));
  const act=t=>t&&t.hist&&t.hist.length?Math.max(...t.hist.map(h=>h.d||0)):0;
  for(const id in L.topics||{}){const lt=L.topics[id],rt=M.topics[id];if(!rt||act(lt)>act(rt)||(rt.status==="locked"&&lt.status!=="locked"))M.topics[id]=lt}
  for(const id in L.cards||{}){const lc=L.cards[id],rc=M.cards[id];if(!rc||(lc.last||0)>(rc.last||0))M.cards[id]=lc}
  const uniq=(a,k)=>{const seen=new Set();return a.filter(x=>{const kk=k(x);if(seen.has(kk))return false;seen.add(kk);return true})};
  const okKeys=new Set([...(L.errors||[]),...(M.errors||[])].filter(e=>e.ok).map(e=>e.d+"|"+e.q));
  M.errors=uniq([...(L.errors||[]),...(M.errors||[])],e=>e.d+"|"+e.q).map(e=>okKeys.has(e.d+"|"+e.q)?{...e,ok:1}:e).sort((a,b)=>b.d-a.d).slice(0,80);
  M.reports=uniq([...(L.reports||[]),...(M.reports||[])],r=>r.d).sort((a,b)=>b.d-a.d).slice(0,10);
  M.packs=[...(M.packs||[]),...(L.packs||[]).filter(t=>!(M.packs||[]).some(x=>x.id===t.id))];
  const ls=L.stats||{},ms=M.stats||{};
  M.stats={...ms,sessions:Math.max(ls.sessions||0,ms.sessions||0),reviews:Math.max(ls.reviews||0,ms.reviews||0),
    ...((ls.last||"")>(ms.last||"")?{streak:ls.streak,last:ls.last}:{})};
  if(L.daily&&M.daily&&L.daily.date===M.daily.date)M.daily={date:M.daily.date,newCards:Math.max(L.daily.newCards,M.daily.newCards),newTopics:Math.max(L.daily.newTopics,M.daily.newTopics)};
  if(L.exToday&&M.exToday&&L.exToday.d===M.exToday.d)M.exToday.k=[...new Set([...L.exToday.k,...M.exToday.k])];
  if(L.active)M.active=L.active;
  M.gloss={...(M.gloss||{}),...(L.gloss||{})};
  if(L.genUnlock&&L.genUnlock.on&&!(M.genUnlock&&M.genUnlock.on))M.genUnlock=L.genUnlock;
  ["lastGlobal","sinceGlobal","lastBackup"].forEach(k=>{M[k]=Math.max(L[k]||0,M[k]||0)});
  M.created=Math.min(L.created||Date.now(),M.created||Date.now());
  return M;
}
/* Holt den neueren Stand aus der Cloud. Rückgabe true = lokaler Stand wurde ersetzt */
async function pullCloud(){
  if(!cloudOn()||!navigator.onLine){if(cloudOn())setSync("offline");return false}
  try{
    const row=await fetchRemote();
    if(!row){if(hasProgress(S)){DIRTY=true;pushCloud()}else setSync("ok");return false}
    const remote=row.data,ru=Date.parse(row.updated_at);
    if((remote.updated||0)>(S.updated||0)&&!SESSION){
      if(hasProgress(S))safeCopy("-vor-sync",S);
      const unsynced=hasProgress(S)&&(S.updated||0)>(CFG.syncedAt||0);
      CFG.remoteAt=ru;saveCfg();
      if(unsynced){S=mergeStates(S,remote);migrate();applyTheme();save();return true}
      S=remote;migrate();writeLocal();applyTheme();DIRTY=false;CFG.syncedAt=S.updated;saveCfg();setSync("ok");return true}
    if((remote.updated||0)!==(S.updated||0)){DIRTY=true;pushCloud()}else{CFG.remoteAt=ru;CFG.syncedAt=S.updated;saveCfg();setSync("ok")}
    return false;
  }catch(e){if(cloudOn())setSync(navigator.onLine?"err":"offline");return false}
}
/* Erste Verbindung eines Geräts: nie einen echten Fortschritt überschreiben */
async function firstLink(){
  CFG.remoteAt=null;saveCfg();
  const row=await fetchRemote(),remote=row&&row.data;
  const score=x=>x?((x.stats&&x.stats.sessions)||0)*10+((x.stats&&x.stats.reviews)||0):0;

   ============================================================ */
function sm2Next(it,q){
  let ease=it.ease??2.5, reps=it.reps??0, interval=it.interval??0, lapses=it.lapses??0;
  if(q<3){reps=0;interval=0;lapses++;ease=Math.max(1.3,ease-0.2);}
  else{
    if(reps===0) interval={3:1,4:1,5:3}[q];
    else if(reps===1) interval={3:2,4:4,5:7}[q];
    else{const f=q===3?1.2:q===4?ease:ease*1.3;interval=Math.max(interval+1,Math.round(interval*f));}
    ease=Math.max(1.3,ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));
    reps++;
  }
  return{ease,reps,interval,lapses};
}
function prereqMet(t){return t.req.every(r=>{const s=S.topics[r];return s&&s.last!=null&&s.last>=0.8})}
function refreshUnlocks(){const opened=[];TOPICS.forEach(t=>{const s=S.topics[t.id];if(s.status==="locked"&&prereqMet(t)){s.status="new";opened.push(t)}});return opened}
function addCards(t){t.v.forEach((w,i)=>{const id=t.id+"-"+i;if(!S.cards[id])S.cards[id]={ease:2.5,interval:0,reps:0,lapses:0,due:null,isNew:true}})}
function cardWord(id){const i=id.lastIndexOf("-");const t=T(id.slice(0,i));return t?t.v[+id.slice(i+1)]||null:null}
function dueTopics(){return TOPICS.filter(t=>{const s=S.topics[t.id];return s.status==="learning"&&s.due&&s.due<=endOfDay()}).sort((a,b)=>S.topics[a.id].due-S.topics[b.id].due)}
function nextNewTopic(){return TOPICS.find(t=>S.topics[t.id].status==="new")}
function dueCards(){const now=Date.now();return Object.keys(S.cards).filter(id=>{const c=S.cards[id];return !c.isNew&&c.due&&c.due<=now&&cardWord(id)})}
function newCardsAvail(){const left=Math.max(0,S.settings.newCardsPerDay-S.daily.newCards);
  const ids=[];TOPICS.forEach(t=>t.v.forEach((w,i)=>{const id=t.id+"-"+i;if(S.cards[id]&&S.cards[id].isNew)ids.push(id)}));return ids.slice(0,left)}
function cardState(c){if(c.isNew)return"neu";if(c.interval>=21)return"sicher";if(c.interval>=4)return"gut";return"lernt"}
function learnedWords(){return Object.values(S.cards).filter(c=>!c.isNew).length}
function masteredTopics(){return TOPICS.filter(t=>(S.topics[t.id].last||0)>=0.8).length}
function weakCards(){return Object.entries(S.cards).filter(([id,c])=>!c.isNew&&cardWord(id)&&(c.lapses>=2||c.ease<2.0)).sort((a,b)=>b[1].lapses-a[1].lapses)}
function streakNow(){const y=todayKey(new Date(Date.now()-DAY));return(S.stats.last===todayKey()||S.stats.last===y)?S.stats.streak:0}
function bumpStreak(){const tk=todayKey();if(S.stats.last===tk)return;const y=todayKey(new Date(Date.now()-DAY));S.stats.streak=S.stats.last===y?S.stats.streak+1:1;S.stats.last=tk}

/* Probiert die Modelle der Reihe nach. Jedes Modell hat ein eigenes Gratis-Kontingent –
   ist eines voll oder überlastet, springt das nächste ein. */
async function geminiCall(system,user,a,opt={}){
  const models=opt.only?[a.model]:[a.model,...GEMINI_MODELS].filter((m,i,arr)=>m&&arr.indexOf(m)===i);
  const caps=CFG.aiCaps||(CFG.aiCaps={});
  let worst=null;const rank={"quota-day":5,"quota-min":4,overload:3,timeout:2,empty:1,net:1,unknown:0};
  const keep=e=>{if(!worst||(rank[e.kind]||0)>=(rank[worst.kind]||0))worst=e};
  for(const m of models){
    for(let attempt=0;attempt<3;attempt++){
      const cap=caps[m]||{};const gc={temperature:0.3,maxOutputTokens:8192};
      if(opt.json&&!cap.noJson)gc.responseMimeType="application/json";
      if(!cap.noThink)gc.thinkingConfig={thinkingLevel:"low"};
      const t0=Date.now();let res;
      try{res=await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{
        method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":a.key},
        body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:gc})},opt.timeout||30000)}
      catch(e){e.model=m;if(e.kind==="offline")throw e;keep(e);break}
      if(res.ok){
        const d=await res.json().catch(()=>({}));const c=d.candidates&&d.candidates[0];
        const txt=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||"").join("").trim();
        if(!txt){keep(aiErr("empty","Leere Antwort ("+((c&&c.finishReason)||"?")+")",m));if(attempt===0&&!cap.noThink){continue}break}
        if(a.model!==m){CFG.ai.model=m}aiLog("ok",m,"",Date.now()-t0);return txt;
      }
      const j=await res.json().catch(()=>({}));const msg=(j.error&&j.error.message)||("HTTP "+res.status);
      if(res.status===400){
        if(/thinking/i.test(msg)&&!cap.noThink){caps[m]={...cap,noThink:1};saveCfg();continue}
        if(/mime|response_?mime/i.test(msg)&&!cap.noJson){caps[m]={...cap,noJson:1};saveCfg();continue}
        if(/api key|api_key|API_KEY/i.test(msg))throw aiErr("key",msg,m);
        keep(aiErr("unknown",msg,m));break}
      if(res.status===401||res.status===403)throw aiErr("key",msg,m);
      if(res.status===404){keep(aiErr("unknown","Modell "+m+" nicht verfügbar",m));break}
      if(res.status===429){keep(aiErr(/per ?day|PerDay|daily/i.test(msg)?"quota-day":"quota-min",msg,m));break}
      if(res.status>=500){keep(aiErr("overload",msg,m));if(attempt<1){await sleep(1500);continue}break}
      keep(aiErr("unknown",msg,m));break;
    }
  }
  throw worst||aiErr("unknown","Kein Modell verfügbar");
}
async function openaiCall(system,user,a){
  const res=await fetchT((a.baseUrl||"https://api.groq.com/openai/v1").replace(/\/+$/,"")+"/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json",Authorization:"Bearer "+a.key},
    body:JSON.stringify({model:a.model||"llama-3.3-70b-versatile",temperature:0.3,messages:[{role:"system",content:system},{role:"user",content:user}]})},30000);

function progressSummary(){
  const L=[];
  L.push(`Lernstart: ${new Date(S.created).toLocaleDateString("de-AT")} | Serie: ${streakNow()} Tage | Sitzungen: ${S.stats.sessions} | Kartenwiederholungen: ${S.stats.reviews}`);
  L.push("\nTHEMEN:");
  TOPICS.forEach(t=>{const s=S.topics[t.id];
    if(s.status==="learning")L.push(`- ${t.id} ${t.title}: zuletzt ${pct(s.last)}, bestes ${pct(s.best)}, Wdh ${s.reps}, Fehlschläge ${s.lapses}, nächste ${fmtDate(s.due)}, Verlauf ${s.hist.slice(-5).map(h=>h.sc+"%").join(" → ")}`);
    else L.push(`- ${t.id} ${t.title}: ${s.status==="new"?"freigeschaltet, noch nicht gelernt":"gesperrt"}`)});
  const all=Object.entries(S.cards).filter(([id])=>cardWord(id)), seen=all.filter(([,c])=>!c.isNew);
  L.push(`\nVOKABELN: ${all.length} gesamt, ${seen.length} gelernt, ${seen.filter(([,c])=>c.interval>=21).length} sicher`);
  const weak=weakCards().slice(0,15).map(([id,c])=>{const w=cardWord(id);return`${w[0]} (${w[1]}) – ${c.lapses}× vergessen`});
  if(weak.length)L.push("Schwierige Wörter: "+weak.join("; "));
  const er=S.errors.slice(0,20);
  if(er.length){L.push("\nLETZTE FEHLER:");er.forEach(e=>L.push(`- [${e.topic}] ${e.q} → „${e.user}“ (richtig: ${e.exp})`))}
  return L.join("\n");
}

async function aiGlobal(){
  const ids=TOPICS.filter(t=>S.topics[t.id].status==="learning").map(t=>t.id).join(", ")||"keine";
  const p=`Aktueller Lernstand:

${progressSummary()}

Analysiere den Fortschritt wie eine erfahrene Finnischlehrerin. Schätze das Niveau (z. B. „A0“, „A0+“, „A1-“), erkenne Muster in Fehlern und vergessenen Wörtern und plane Wiederholungen neu, wo es sinnvoll ist (nur diese Themen-IDs: ${ids}; schwache Themen früher, sehr sichere ruhig später).
Halte jeden Text kurz (Listen höchstens 3 Punkte mit je max. 12 Wörtern), damit die Antwort vollständig bleibt.
Entscheide außerdem streng, ob die Grundlagen (Themen ${BASE_TOPICS.map(t=>t.id).join(", ")}) über mehrere Wiederholungen sicher sitzen. Nur dann bekommt der Schüler frei erzeugte Zusatzübungen. Im Zweifel false.
JSON: {"level":"…","summary":"2 Sätze","strengths":["…"],"weaknesses":["…"],"tips":["…"],"reschedule":[{"topicId":"t0X","days":1,"reason":"max. 8 Wörter"}],"nextFocus":"1 motivierender Satz","basicsSolid":false,"basicsReason":"1 kurzer Satz"}`;
  return claudeJSON(p);
}

async function runGlobal(silent){
  if(GLOBAL_RUNNING)return; if(!aiReady()){if(!silent)toast("Opettaja ist nicht eingerichtet – siehe Einstellungen → Cloud & KI");return}
  if(!TOPICS.some(t=>S.topics[t.id].status==="learning")){if(!silent)toast("Lerne zuerst ein Thema");return}
  GLOBAL_RUNNING=true; if(!silent){const b=$("#globalbox");if(b)b.innerHTML=`<p class="muted">Opettaja analysiert deinen Fortschritt ${dots()}</p>`}
  try{
    const j=await aiGlobal();
    (j.reschedule||[]).forEach(r=>{const s=S.topics[r.topicId];const d=clampInt(r.days,1,180);
      if(s&&s.status==="learning"&&d){s.due=addDays(d);s.interval=d;s.ai={...(s.ai||{}),reason:"Gesamtanalyse: "+(r.reason||"")}}});
    S.reports.unshift({d:Date.now(),...j}); S.reports=S.reports.slice(0,10);
    if(!genUnlocked()&&j.basicsSolid===true&&basicsStatus().ok){S.genUnlock={on:true,d:Date.now(),reason:j.basicsReason||""};setTimeout(()=>toast("Freigeschaltet: Neue Übungen von Opettaja – deine Grundlagen sitzen!"),2600)}
    S.lastGlobal=Date.now(); S.sinceGlobal=0; save();
    if(!SESSION&&(CUR.tab==="today"||CUR.tab==="progress"))render();
    toast("Opettaja hat deinen Lernplan aktualisiert");
  }catch(e){GLOBAL_FAILED_AT=Date.now();if(!silent){toast("Opettaja nicht erreichbar: "+aiErrShort());render()}}
  GLOBAL_RUNNING=false;
}
let GLOBAL_FAILED_AT=0;
function maybeAutoGlobal(){
  if(!aiReady()||GLOBAL_RUNNING||Date.now()-GLOBAL_FAILED_AT<30*60000)return;
  const stale=Date.now()-S.lastGlobal>3*DAY;
  if(S.sinceGlobal>=3||(stale&&S.sinceGlobal>=1))runGlobal(true);
}

  if(!S.settings.ai){box.innerHTML=h+row(false,"Opettaja","ist in den Einstellungen ausgeschaltet");return}
  if(!a.key||!a.provider||a.provider==="none"){box.innerHTML=h+row(false,"KI-Schlüssel","fehlt – unter „Cloud & KI einrichten“ eintragen");return}
  if(a.provider==="openai"){try{const t0=Date.now();await openaiCall("Antworte mit OK.","Test",a);box.innerHTML=h+row(true,"Anbieter",`antwortet (${Date.now()-t0} ms)`)}catch(e){box.innerHTML=h+row(false,"Anbieter",aiErrText(e))}return}
  // Schlüssel + verfügbare Modelle
  let avail=[];
  try{const r=await fetchT("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200",{headers:{"x-goog-api-key":a.key}},15000);
    if(r.status===400||r.status===401||r.status===403){box.innerHTML=h+row(false,"API-Schlüssel","ungültig – auf aistudio.google.com einen neuen erstellen und unter „Cloud & KI einrichten“ eintragen");return}
    if(!r.ok)throw aiErr(r.status>=500?"overload":"unknown","HTTP "+r.status);
    const d=await r.json();avail=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""));
    put(row(true,"API-Schlüssel","gültig"));
  }catch(e){box.innerHTML=h+row(false,"Google erreichbar",aiErrText(e));return}
  const flash=avail.filter(m=>/flash/i.test(m)&&!/image|tts|audio|live|exp|preview/i.test(m));
  const cands=[...GEMINI_MODELS,...flash].filter((m,i,arr)=>arr.indexOf(m)===i&&(avail.includes(m)||GEMINI_MODELS.includes(m))).slice(0,7);
  const results=[];
  for(const m of cands){
    const t0=Date.now();let r;
    try{const txt=await geminiCall("Antworte nur mit dem Wort OK.","Test",{...a,model:m},{timeout:20000,only:true});
      r={m,ok:true,ms:Date.now()-t0};}
    catch(e){r={m,ok:false,err:e};aiLog(e.kind||"unknown",m,e.message)}
    results.push(r);put(row(r.ok,m,r.ok?`${r.ms} ms`:aiErrText(r.err)));
  }
  const good=results.filter(r=>r.ok).sort((x,y)=>(/lite/.test(x.m)-/lite/.test(y.m))||(cands.indexOf(x.m)-cands.indexOf(y.m)));
  if(good.length){CFG.ai.model=good[0].m;saveCfg();LAST_AI_ERR=null;
    h+=`<p style="color:var(--kuusi);margin-top:10px">✓ Opettaja ist erreichbar. Eingestellt: <b>${esc(good[0].m)}</b> (bestes erreichbares Modell). Fällt es aus, springen die anderen automatisch ein.</p>`}
  else{const kinds=results.map(r=>r.err&&r.err.kind);
    const tip=kinds.includes("quota-day")?"Das Gratis-Tageslimit ist bei allen Modellen aufgebraucht. Es setzt sich täglich um ca. 9 Uhr (österreichische Zeit) zurück. Bis dahin funktioniert alles ohne KI weiter.":
      kinds.includes("quota-min")?"Zu viele Anfragen in kurzer Zeit. Warte eine Minute und prüf dann nochmal.":
      kinds.includes("overload")?"Google ist gerade überlastet. Das ist meist nach wenigen Minuten vorbei.":
      kinds.includes("timeout")?"Die Verbindung ist sehr langsam. Probier es mit besserem Empfang oder WLAN.":"Unklarer Fehler – siehe Protokoll unten.";
    h+=`<p style="color:var(--puolukka);margin-top:10px">Kein Modell antwortet gerade.</p><p>${tip}</p>`}
  box.innerHTML=h+aiLogHTML();
}

function authErr(m){
  if(/invalid login|invalid_credentials/i.test(m))return"E-Mail oder Passwort falsch.";
  if(/already registered|already exists/i.test(m))return"Diese E-Mail ist schon registriert – bitte „Anmelden“ verwenden.";
  if(/not confirmed/i.test(m))return"Bitte zuerst die Bestätigungs-E-Mail von Supabase öffnen, dann „Anmelden“.";
  if(/failed to fetch|networkerror|load failed/i.test(m))return"Keine Verbindung. Stimmt die Project URL und bist du online?";
  if(/api key|apikey|jwt/i.test(m))return"Der anon public key stimmt nicht.";
  return"Fehler: "+m;
}
async function doAuth(kind){
  const url=$("#sburl").value.trim().replace(/\/+$/,""),key=$("#sbkey").value.trim(),mail=$("#sbmail").value.trim(),pw=$("#sbpw").value,msg=$("#authmsg");
  const bad=t=>{msg.innerHTML=`<p class="muted" style="color:var(--puolukka);margin-top:10px">${esc(t)}</p>`};
  if(!/^https:\/\/\S+$/.test(url))return bad("Bitte die Project URL eintragen (beginnt mit https://).");
  if(!key)return bad("Bitte den anon public key eintragen.");
  if(!mail||pw.length<6)return bad("Bitte E-Mail und Passwort (mind. 6 Zeichen) eintragen.");
  CFG.sbUrl=url;CFG.sbKey=key;CFG.lastMail=mail;saveCfg();
  msg.innerHTML=`<p class="muted" style="margin-top:10px">Verbinde ${dots()}</p>`;
  try{
    const j=kind==="signup"?await authCall("signup",{email:mail,password:pw}):await authCall("token?grant_type=password",{email:mail,password:pw});
    if(!j.access_token){msg.innerHTML=`<p style="margin-top:10px">Fast geschafft: Öffne die Bestätigungs-E-Mail von Supabase und tippe danach hier auf „Anmelden“.</p>`;return}
    setSession(j);
    const r=await firstLink();
    toast(r==="remote"?"Fortschritt aus der Cloud geladen ✓":"Verbunden – dein Fortschritt ist jetzt in der Cloud ✓");
    renderSetup();
  }catch(e){bad(authErr(e.message||String(e)))}
}

function reqLine(t){return reqInfo(t).map(r=>`${esc(r.t.title)} (${r.s.last!=null?"zuletzt "+pct(r.s.last):"noch nicht geübt"}) <span class="${r.ok?"ok":"no"}">${r.ok?"✓":"✗"}</span>`).join(" · ")}
function reqHint(r){const s=r.s;

/* ---------- Übungs-Sitzung ---------- */
/* ---------- Wörter antippen → deutsche Bedeutung ---------- */
let DICT=null,DICT_N=-1;
function gkey(w){return norm(String(w).replace(/\(.*?\)/g,"")).replace(/[?]/g,"").trim()}
function buildDict(){
  if(DICT&&DICT_N===TOPICS.length)return DICT;DICT={};DICT_N=TOPICS.length;
  const add=(k,v)=>{k=gkey(k);if(k&&!DICT[k])DICT[k]=v};
  TOPICS.forEach(t=>t.v.forEach(([fi,de])=>{add(fi,{de});const parts=gkey(fi).split(" ");if(parts.length>1)parts.forEach(x=>{if(x.length>2)add(x,{de:"(in: „"+fi+"“ = "+de+")"})})}));
  // Verbformen aus den Tabellen-Übungen: Spaltenkopf = Grundform, erste Spalte = Person
  TOPICS.forEach(t=>t.ex.forEach(e=>{if(e.t!=="tab"||!e.head)return;
    e.head.forEach((h,ci)=>{const base=gkey(h).replace(/\?$/,""),entry=DICT[base];if(!entry||ci===0)return;
      e.r.forEach(row=>{const g=tabGap(row[ci]);const per=tabGap(row[0])?tabGap(row[0])[0]:row[0];if(!g)return;
        g.forEach(f=>add(f,{de:entry.de,base,note:(/\?/.test(h)?"Frageform":"Form")+" für „"+per+"“"}))})})}));
  return DICT;
}
function glossLocal(w){
  const d=buildDict(),k=gkey(w);if(!k)return null;
  if(d[k])return{...d[k],w:k};
  const g=S.gloss&&S.gloss[k];if(g)return{...g,w:k,ai:1};
  const ends=["issa","issä","ssa","ssä","sta","stä","lla","llä","lle","ko","kö","mme","tte","vat","vät","n","t"];
  for(const e of ends){if(!k.endsWith(e)||k.length-e.length<3)continue;const r=k.slice(0,-e.length);
    const hit=Object.keys(d).find(x=>x===r||(x.length>3&&x.slice(0,-1)===r)||(x.startsWith(r)&&x.length-r.length<=1));
    if(hit)return{...d[hit],base:d[hit].base||hit,w:k,guess:1}}
  const pl=/^([A-ZÄÖ][a-zäöå]+?)i?ss[aä]$/.exec(String(w).trim());if(pl)return{de:"in "+pl[1],note:"Ort + -ssa/-ssä = „in …“",w:k};
  return null;
}
function glossWords(text,onlyKnown){
  return String(text).split(/([A-Za-zÄÖÅäöåÜüß][A-Za-zÄÖÅäöåÜüß'’-]*)/).map((p,i)=>{
    if(i%2===0)return esc(p);
    if(onlyKnown&&!glossLocal(p))return esc(p);
    return`<span class="gw" data-act="gloss" data-id="${esc(p)}">${esc(p)}</span>`}).join("");
}
function glossQuoted(text){return esc(text).replace(/„([^“]+)“/g,(m,x)=>"„"+glossWords(x.replace(/&#39;/g,"'").replace(/&amp;/g,"&"))+"“")}
function closeGloss(){const g=$("#gloss");if(g)g.remove();document.querySelectorAll(".gw.on").forEach(x=>x.classList.remove("on"))}
async function showGloss(w,el){
  closeGloss();el.classList.add("on");
  const box=document.createElement("div");box.id="gloss";document.body.appendChild(box);
  const place=()=>{const r=el.getBoundingClientRect(),bw=box.offsetWidth,bh=box.offsetHeight;
    let x=Math.min(Math.max(16,r.left+r.width/2-bw/2),innerWidth-bw-16),y=r.bottom+8;if(y+bh>innerHeight-80)y=r.top-bh-8;
    box.style.left=x+"px";box.style.top=Math.max(8,y)+"px"};
  const show=g=>{if(!document.body.contains(box))return;
    box.innerHTML=`<b>${esc(w)}</b> ${spk(w)}<div>${esc(g.de)}</div>${g.base&&g.base!==gkey(w)?`<small>${g.guess?"vermutlich von":"von"} <b>${esc(g.base)}</b>${g.note?" · "+esc(g.note):""}</small>`:g.note?`<small>${esc(g.note)}</small>`:""}${g.ai?`<small>Erklärt von Opettaja</small>`:""}`;place()};
  const loc=glossLocal(w);if(loc)return show(loc);
  if(!aiReady()){box.innerHTML=`<b>${esc(w)}</b><div class="muted">Noch nicht in deinem Wortschatz.</div>`;place();return}
  box.innerHTML=`<b>${esc(w)}</b><div class="muted">Opettaja schaut nach ${dots()}</div>`;place();
  const sent=(el.closest(".q,.fb,td,.opt")||el).textContent.slice(0,200);
  try{const j=await claudeJSON(`Finnisches Wort: "${w}" im Satz: "${sent}". Gib die deutsche Bedeutung in diesem Satz, die Grundform und – falls gebeugt – kurz die Form an.
JSON: {"de":"deutsche Bedeutung, max. 6 Wörter","base":"Grundform (Wörterbuchform)","note":"z. B. ‚ich-Form‘ oder ‚in …‘ (‚-ssa‘), max. 6 Wörter, sonst leer"}`);
    const g={de:String(j.de||"?").slice(0,80),base:gkey(j.base||""),note:String(j.note||"").slice(0,60)};
    S.gloss=S.gloss||{};S.gloss[gkey(w)]=g;save();show({...g,ai:1});
  }catch(e){if(document.body.contains(box)){box.innerHTML=`<b>${esc(w)}</b><div class="muted">Opettaja nicht erreichbar: ${esc(aiErrShort())}</div>`;place()}}
}
document.addEventListener("click",e=>{if(!e.target.closest("#gloss,.gw"))closeGloss()},true);
addEventListener("scroll",closeGloss,{passive:true});

/* Tabellen-Übung: Zellen in [eckigen Klammern] sind Lücken, Alternativen mit | trennen */
function tabGap(c){const m=/^\[(.*)\]$/.exec(String(c).trim());return m?m[1].split("|").map(x=>x.trim()).filter(Boolean):null}
function tabGaps(ex){const g=[];ex.r.forEach(row=>row.forEach(c=>{const a=tabGap(c);if(a)g.push(a)}));return g}
function promptText(ex){if(ex.t==="tab")return ex.q;return ex.t==="mc"?ex.q:ex.t==="gap"?ex.q+(ex.h?` (${ex.h})`:""):ex.t==="ord"?ex.de:ex.q}
function expectedText(ex){if(ex.t==="tab")return tabGaps(ex).map(a=>a[0]).join(", ");return ex.t==="mc"?ex.o[ex.a]:ex.t==="gap"?ex.q.replace("___",ex.a[0]):ex.t==="ord"?ex.a:ex.a[0]}
/* Fehler-Training: offene Fehler, die sich einer Übung zuordnen lassen */
function errKey(e){return e.ei!=null&&e.ei>=0?e.topic+":"+e.ei:"q:"+e.topic+":"+e.q}
function errEx(e){
  if(e.gx&&validEx(e.gx))return e.gx;
  const t=T(e.topic);if(!t)return null;
  if(e.ei!=null&&e.ei>=0)return t.ex[e.ei]||null;
  const i=t.ex.findIndex(x=>promptText(x)===e.q);if(i>=0){e.ei=i;return t.ex[i]}return null}
function openErrors(){const seen=new Set(),out=[];
  (S.errors||[]).forEach(e=>{if(e.ok)return;const ex=errEx(e);if(!ex)return;const k=errKey(e);if(seen.has(k))return;seen.add(k);out.push({e,ex})});
  const solved=new Set((S.errors||[]).filter(e=>e.ok).map(errKey));return out.filter(o=>!solved.has(errKey(o.e)))}
function startErrors(){
  const list=openErrors().slice(0,10);if(!list.length){toast("Keine offenen Fehler – super!");return}
  const gen=list.map(o=>o.ex),gsrc=list.map(o=>({tid:o.e.topic,ei:o.e.ei!=null?o.e.ei:-1}));
  const idxs=shuffle(gen.map((_,i)=>i));
  S.active={id:"__err",mode:"errors",title:"Fehler-Training",gen,gsrc,idxs,rt:idxs.map(()=>0),idx:0,results:[],d:Date.now()};save();openSession();
}
function exDoneToday(){if(!S.exToday||S.exToday.d!==todayKey())S.exToday={d:todayKey(),k:[]};return S.exToday}
function startSession(id,mode){
  const t=T(id),done=exDoneToday().k;let all=shuffle(t.ex.map((_,i)=>i));
  if(mode!=="learn"){const fresh=all.filter(i=>!done.includes(id+":"+i));all=[...fresh,...all.filter(i=>done.includes(id+":"+i))]}
  const idxs=mode==="learn"||mode==="unlock"?all:all.slice(0,Math.min(8,all.length));
  S.active={id,mode,idxs,rt:idxs.map(()=>0),idx:0,results:[],d:Date.now()};
  if(mode==="unlock")S.active.title=t.title+" · Freischaltversuch";
  save();
  openSession();
}
/* Freie Sitzungen (Fehler-Training, neue Übungen) tragen ihre Übungen selbst in a.gen */
function exOf(a,j){const v=a.idxs[j];if(a.gen)return a.gen[v]||null;const t=T(a.id);return t?t.ex[v]||null:null}
function srcOf(a,j){const v=a.idxs[j];return a.gsrc?(a.gsrc[v]||{tid:a.id,ei:-1}):{tid:a.id,ei:v}}
function activeTitle(a){return a.title||(T(a.id)||{}).title||"Übung"}
function isFree(mode){return mode==="extra"||mode==="errors"||mode==="gen"}
function openSession(){
  const a=S.active;if(!a||(!a.gen&&!T(a.id))){S.active=null;save();return render()}
  if(!a.rt||a.rt.length!==a.idxs.length)a.rt=a.idxs.map(()=>0);
  if(a.idxs.some((_,j)=>!exOf(a,j))){const keep=a.idxs.map((_,j)=>exOf(a,j)?j:-1).filter(j=>j>=0);a.idx=keep.filter(j=>j<a.idx).length;a.idxs=keep.map(j=>a.idxs[j]);a.rt=keep.map(j=>a.rt[j])}
  if(!a.idxs.length){S.active=null;save();return render()}
  SESSION={kind:"topic",id:a.id,mode:a.mode,title:activeTitle(a),items:a.idxs.map((_,j)=>exOf(a,j)),idx:Math.min(a.idx,a.idxs.length),results:(a.results||[]).slice(),locked:false,cur:null};
  CUR=a.mode==="errors"?{tab:"today",arg:null}:{tab:"topics",arg:a.id};setTab(CUR.tab);scrollTo(0,0);
  if(SESSION.idx>=SESSION.items.length)finishTopic();else renderEx();
}
function renderEx(){
  const se=SESSION,ex=se.items[se.idx];se.locked=false;
  const isRetry=!!(S.active&&S.active.rt&&S.active.rt[se.idx]);
  let h=`<div class="sbar"><div class="prog"><i style="width:${se.idx/se.items.length*100}%"></i></div><small>${se.idx+1}/${se.items.length}</small><button class="xbtn" data-act="abort">Abbrechen</button></div><div class="card">${isRetry?'<span class="badge" style="margin-bottom:8px;display:inline-block">Nochmal üben</span>':""}`;
  if(ex.t==="mc"){se.cur={opts:shuffle(ex.o.map((o,i)=>({o,ok:i===ex.a})))};
    h+=`<div class="ask">Wähle die richtige Antwort</div><div class="q">${glossQuoted(ex.q)}</div><div class="opts">${se.cur.opts.map((o,i)=>`<button class="opt" data-act="mc" data-id="${i}">${esc(o.o)}</button>`).join("")}</div><div class="btnrow"><button class="btn ghost" data-act="dunno">Weiß ich nicht</button></div>`;}
  else if(ex.t==="gap"){
    h+=`<div class="ask">Ergänze die Lücke</div><div class="q">${ex.q.split("___").map(x=>glossWords(x)).join('<span class="gap">&nbsp;?&nbsp;</span>')}</div>${ex.h?`<div class="hint">${esc(ex.h)}</div>`:""}<input id="ans" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Deine Antwort"><div class="btnrow"><button class="btn ghost" data-act="dunno">Weiß ich nicht</button><button class="btn" data-act="check">Prüfen</button></div>`;}
  else if(ex.t==="tr"){

  else if(ex.t==="tab"){let k=0;

function localCheck(user,acc,strict){
  const u=norm(user);
  if(acc.some(a=>norm(a)===u))return{correct:true};
  if(!strict&&acc.some(a=>loose(a)===loose(user)))return{correct:true,note:"Fast perfekt – achte auf ä und ö. Richtig: "+acc[0]};
  return{correct:false};
}

async function checkAnswer(){
  const se=SESSION;if(!se||se.locked)return;const ex=se.items[se.idx];

  if(ex.t==="ord"){if(!se.cur.picked.length)return;user=se.cur.picked.map(i=>se.cur.chips[i]).join(" ");acc=[ex.a]}
  else{user=($("#ans").value||"").trim();if(!user)return;acc=ex.t==="gap"?[...ex.a,...ex.a.map(a=>ex.q.replace("___",a))]:ex.a}
  se.locked=true;const inp=$("#ans");if(inp)inp.disabled=true;if(ex.t==="ord")renderOrd();

function tabMark(ex,user,showAll){

    if(r.note)near=true;if(!r.correct)allOk=false;
    if(showAll&&!user[k]){inp.value="";inp.placeholder="";}
    inp.classList.add(r.correct?"ok":"no");
    if(!r.correct||r.note)inp.insertAdjacentHTML("afterend",`<span class="sol">${esc(gaps[k][0])}</span>`)});
  return{allOk,near};
}

function record(ex,user,res){
  const se=SESSION,q=promptText(ex),exp=res.correction||expectedText(ex);
  const a=S.active&&S.active.id===se.id?S.active:null,retry=!!(a&&a.rt&&a.rt[se.idx]);
  const src=a?srcOf(a,se.idx):{tid:se.id,ei:-1};
  se.results.push({q,user,exp,correct:res.correct,retry});
  if(!res.correct&&!retry){const e={d:Date.now(),topic:src.tid,ei:src.ei,q,user,exp};if(src.ei<0)e.gx=ex;S.errors.unshift(e);S.errors=S.errors.slice(0,80)}
  if(se.mode==="errors"&&res.correct&&!retry){const k=errKey({topic:src.tid,ei:src.ei,q});S.errors.forEach(e=>{if(errKey(e)===k)e.ok=1})}
  if(a){
    const exi=a.idxs[se.idx];
    if(res.correct&&src.ei>=0){const dt=exDoneToday();const k=src.tid+":"+src.ei;if(!dt.k.includes(k))dt.k.push(k)}
    else{const pos=Math.min(se.idx+4,a.idxs.length);a.idxs.splice(pos,0,exi);a.rt.splice(pos,0,1);se.items.splice(pos,0,ex);res.requeue=true}

}

async function rateTopic(k){
  const se=SESSION;if(!se||se.rated)return;se.rated=true;
  const t=T(se.id),s=S.topics[se.id],score=se.score;
  let q=RQ[k];if(score<0.6)q=Math.min(q,2);else if(score<0.8)q=Math.min(q,3);
  const base=sm2Next(s,q),baseDays=Math.max(1,base.interval);
  s.ease=base.ease;s.reps=base.reps;s.lapses=base.lapses;
  s.last=score;s.best=Math.max(s.best||0,score);
  s.hist.push({d:Date.now(),sc:Math.round(score*100),r:k});s.hist=s.hist.slice(-30);
  const wasNew=s.status==="new";
  if(wasNew){s.status="learning";addCards(t);S.daily.newTopics++}
  s.interval=baseDays;s.due=addDays(baseDays);s.ai={...(s.ai||{}),reason:"Plan nach Algorithmus"};
  bumpStreak();S.stats.sessions++;S.sinceGlobal++;S.active=null;
  const opened=refreshUnlocks();save();
  const unl=opened.length?`<div class="card" style="border-color:var(--kuusi)"><b style="color:var(--kuusi)">Neu freigeschaltet:</b> ${opened.map(o=>esc(o.title)).join(", ")}</div>`:"";

  const box=$("#ratebox");
  const miss=se.mode==="unlock"&&score<0.8?`<div class="card" style="border-color:var(--lakka)"><b>Noch nicht 80 %</b> – du kannst jederzeit einen neuen Freischaltversuch starten. Tipp: zuerst die Fehler oben ansehen und das Fehler-Training machen.</div>`:"";
  const tail=`${miss}${unl}<div class="btnrow"><button class="btn" data-act="tab" data-id="today">Weiter</button></div>`;
  if(!aiReady()){box.innerHTML=`<div class="plan" style="border:0;margin:0;padding:0">Nächste Wiederholung: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})</div>${words}`;box.insertAdjacentHTML("afterend",tail);SESSION=null;return}
  box.innerHTML=`<p class="muted">Opettaja wertet deine Runde aus ${dots()}</p>`;
  try{
    const j=await aiSessionReview(t,s,se.results.filter(r=>!r.retry),score,k,baseDays);
    const d=clampInt(j.intervalDays,1,180)||baseDays;
    s.interval=d;s.due=addDays(d);s.ai={feedback:j.feedback,tips:j.tips||[],reason:j.reason||"",date:Date.now()};save();
    box.classList.add("aibox");
    box.innerHTML=`<div class="label">Opettaja</div><p>${esc(j.feedback)}</p>${(j.tips||[]).length?`<ul>${j.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}<div class="plan">Nächste Wiederholung: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})<br><small>${esc(j.reason||"")}</small></div>${words}`;
  }catch(e){
    box.innerHTML=`<div class="plan" style="border:0;margin:0;padding:0">Nächste Wiederholung: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})<br><small>Opettaja war nicht erreichbar (${esc(aiErrShort())}), daher gilt der Standardplan.</small></div>${words}`;
  }
  box.insertAdjacentHTML("afterend",tail);SESSION=null;
}

/* ---------- Lektionspakete (neue Themen ohne neue App-Version) ---------- */
/* Theorie-HTML aus Lektionen: nur harmlose Elemente und Attribute (Allowlist), nie Scripts, Events oder Links nach außen */
const SAFE_TAGS=new Set(["P","H3","H4","TABLE","THEAD","TBODY","TR","TD","TH","I","B","S","DEL","EM","STRONG","U","SMALL","BR","UL","OL","LI","SPAN","DIV","SUP","SUB","CODE"]);
function sanitizeHTML(h){
  const tpl=document.createElement("template");tpl.innerHTML=String(h||"");
  const walk=node=>{[...node.children].forEach(el=>{
    if(!SAFE_TAGS.has(el.tagName)){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|svg|math)$/i.test(el.tagName))el.remove();else{walk(el);el.replaceWith(...el.childNodes)}return}
    [...el.attributes].forEach(a=>{if(!["class","colspan","rowspan"].includes(a.name))el.removeAttribute(a.name)});
    walk(el)})};
  walk(tpl.content);return tpl.innerHTML}
function validEx(e){if(!e||typeof e!=="object")return false;
  if(e.t==="mc")return typeof e.q==="string"&&Array.isArray(e.o)&&e.o.length>1&&Number.isInteger(e.a)&&e.a>=0&&e.a<e.o.length;
  if(e.t==="gap")return typeof e.q==="string"&&e.q.includes("___")&&Array.isArray(e.a)&&e.a.length>0;
  if(e.t==="tr")return typeof e.q==="string"&&(e.dir==="de"||e.dir==="fi")&&Array.isArray(e.a)&&e.a.length>0;
  if(e.t==="ord")return Array.isArray(e.w)&&e.w.length>1&&typeof e.a==="string"&&typeof e.de==="string";
  if(e.t==="tab")return typeof e.q==="string"&&Array.isArray(e.r)&&e.r.every(Array.isArray)&&tabGaps(e).length>0;
  return false}
/* Streng: ein einziger fehlerhafter Eintrag macht das ganze Thema ungültig. Nie einzelne Einträge
   herausfiltern – Karten-IDs und Fehler hängen am Index, sonst rutschen sie auf falsche Wörter. */
function validTopic(t){if(!(t&&typeof t.id==="string"&&/^[\w-]+$/.test(t.id)&&t.title&&Array.isArray(t.v)&&Array.isArray(t.ex)))return false;
  return t.ex.length>0&&t.ex.every(validEx)&&t.v.every(w=>Array.isArray(w)&&w.length>=2&&w[0]&&w[1])}
/* Ein Update darf in einem bestehenden Thema nichts entfernen (nur hinten anhängen) */
function packUpdateOk(old,t){return !old||(t.v.length>=old.v.length&&t.ex.length>=old.ex.length)}
function importPack(txt){
  try{
    const d=JSON.parse(String(txt).replace(/```json|```/g,"").trim());
    const list=Array.isArray(d)?d:d.topics;if(!Array.isArray(list)||!list.length)throw 0;
    let n=0;
    list.forEach(t=>{if(!validTopic(t)||BASE_TOPICS.some(b=>b.id===t.id))return;
      t.th=sanitizeHTML(t.th);t.req=Array.isArray(t.req)?t.req:[];t.fi=t.fi||"";t.lvl=t.lvl||"";
      const i=S.packs.findIndex(x=>x.id===t.id);if(i>=0&&!packUpdateOk(S.packs[i],t))return;if(i>=0)S.packs[i]=t;else S.packs.push(t);n++});
    if(!n)throw 0;
    migrate();save();CUR={tab:"topics",arg:null};render();toast(n+" Themen eingespielt ✓ – dein Fortschritt bleibt erhalten");
  }catch(e){toast("Das ist kein gültiges Lektionspaket")}
}

/* Lektionen aus dem Repository (lektionen/lektionen.json) automatisch laden.
   Claude legt neue Themen dort ab – die App übernimmt sie beim Start, der Fortschritt bleibt erhalten. */
async function loadRepoLessons(){
  try{
    const r=await fetch("lektionen/lektionen.json",{cache:"no-store"});if(!r.ok)return;
    const d=await r.json();const list=Array.isArray(d)?d:(d.topics||[]);let added=0,updated=0;const bad=[];
    list.forEach(t=>{if(!t||BASE_TOPICS.some(b=>b.id===t.id))return;t=JSON.parse(JSON.stringify(t));
      const i=S.packs.findIndex(x=>x.id===t.id);
      if(!validTopic(t)||(i>=0&&!packUpdateOk(S.packs[i],t))){bad.push(t.id||"?");return}
      t.th=sanitizeHTML(t.th);t.req=Array.isArray(t.req)?t.req:[];t.fi=t.fi||"";t.lvl=t.lvl||"";
      if(i<0){S.packs.push(t);added++}else if(JSON.stringify(S.packs[i])!==JSON.stringify(t)){S.packs[i]=t;updated++}});
    if(added||updated){DICT=null;migrate();save();if(!SESSION)render();
      toast(added?`${added} neue${added===1?"s Thema":" Themen"} von Claude geladen ✓`:"Lektionen aktualisiert ✓")}
    if(bad.length){console.warn("Fehlerhafte Lektionen übersprungen:",bad);if(!added&&!updated)toast("Lektion "+bad.join(", ")+" ist fehlerhaft und wurde übersprungen – bitte Claude Bescheid geben")}
  }catch(e){}
}

  <div class="setrow"><span>Langsam vorlesen</span><button class="btn sm ${S.settings.slow?"":"ghost"}" data-act="toggleslow">${S.settings.slow?"An":"Aus"}</button></div>

  <div class="btnrow"><button class="btn" data-act="download">Sicherung herunterladen</button><button class="btn ghost" data-act="offline">Notfall-Version herunterladen</button></div>
  <div class="btnrow"><button class="btn ghost" data-act="export">Backup kopieren</button><button class="btn ghost" data-act="importopen">Sicherung einspielen</button></div>
  <div id="out2"></div>
  <div class="btnrow"><button class="btn danger" data-act="reset">Fortschritt löschen</button></div></div>`;
  app().innerHTML=h;
}
function showOut(target,text,title){
  $(target).innerHTML=`<p style="margin-top:14px"><b>${esc(title)}</b></p><textarea class="out" id="outta" readonly>${esc(text)}</textarea><div class="btnrow"><button class="btn sm" data-act="copy">Kopieren</button></div>`;
}
async function copyOut(){const ta=$("#outta");try{await navigator.clipboard.writeText(ta.value);toast("Kopiert ✓")}catch(e){ta.focus();ta.select();try{document.execCommand("copy");toast("Kopiert ✓")}catch(e2){toast("Bitte Text markieren und manuell kopieren")}}}

const A={
  say:t=>speak(t),
  theme:k=>{S.settings.theme=k;applyTheme();save();render()},
  setup:()=>{SESSION=null;CUR={tab:"setup",arg:null};render();scrollTo(0,0)},
  setupdone:()=>{CFG.setupDone=true;saveCfg();CUR={tab:"today",arg:null};render();scrollTo(0,0)},
  login:()=>doAuth("login"),
  signup:()=>doAuth("signup"),
  logout:(id,b)=>{if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Wirklich abmelden?";return}CFG.session=null;saveCfg();setSync("local");render()},
  aisave:()=>aiSave(),
  gloss:(w,el)=>{if(el.classList.contains("on")){closeGloss();return}showGloss(w,el)},
  aidiag:()=>{if(!$("#aidiagbox")){SESSION=null;CUR={tab:"progress",arg:null};render()}const b=$("#aidiagbox");b.scrollIntoView({behavior:"smooth",block:"center"});aiDiagnose()},
  snaps:()=>listSnaps(),
  loadsnap:(day,b)=>loadSnap(day,b),

  resettopic:(id,b)=>{if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Wirklich zurücksetzen?";b.classList.remove("ghost");return}resetTopic(id)},
  autofilechange:()=>setupAutoFile(true),

  fileperm:()=>writeAutoFile(true).then(()=>render()),
  offline:()=>downloadOffline(),
  resume:()=>openSession(),
  abort:()=>{const id=SESSION&&SESSION.id,m=SESSION&&SESSION.mode;S.active=null;save();SESSION=null;CUR=m==="errors"?{tab:"today",arg:null}:{tab:"topics",arg:id};render()},
  download:()=>downloadBackup(),
  sharebackup:()=>shareBackup(),
  backuplater:()=>{CFG.backupSnooze=Date.now()+DAY;saveCfg();render()},
  listen:()=>startListen(),
  listens:()=>startListenS(),
  lscheck:()=>checkListenS(false),
  lsreveal:()=>checkListenS(true),
  lsnext:()=>{SESSION.idx++;renderListenS()},
  errtrain:()=>startErrors(),
  gen:(id,b)=>startGen(id,b),
  lcheck:()=>checkListen(),
  lnext:()=>{SESSION.idx++;renderListen()},
  toggleauto:()=>{S.settings.autoplay=!S.settings.autoplay;save();render()},
  toggleslow:()=>{S.settings.slow=!S.settings.slow;save();render()},
  tab:id=>{SESSION=null;CUR={tab:id,arg:null};render();scrollTo(0,0)},
  topic:id=>{SESSION=null;CUR={tab:"topics",arg:id};render();scrollTo(0,0)},
  back:()=>{CUR.arg=null;render()},
  learn:id=>startSession(id,"learn"),

  extra:id=>startSession(id,"extra"),
  mc:i=>answerMC(+i),

  dunno:()=>dunno(),
  next:()=>nextEx(),
